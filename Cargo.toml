[package]
name = "heic-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Pure-Rust HEIC/HEIF image decoder: no C, no unsafe, no_std-friendly, wasm-ready"
repository = "https://github.com/tbraun96/heic-rs"
homepage = "https://github.com/tbraun96/heic-rs"
documentation = "https://docs.rs/heic-rs"
readme = "README.md"
keywords = ["heic", "heif", "image", "decoder", "hevc"]
categories = ["multimedia::images", "encoding", "no-std", "wasm"]
exclude = ["tests/fixtures/*.heic", "tests/fixtures/*.png", ".github/*"]

[lib]
name = "heic_rs"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
# Exposes the decoder's internal stages to `benches/`. Not public API.
bench = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decode"
harness = false

[[example]]
name = "decode"
required-features = ["std"]

[[example]]
name = "probe"
required-features = ["std"]

[[example]]
name = "to_png"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.bench]
debug = true
