version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    ignore:
      # `dtolnay/rust-toolchain@1.85` names the Rust version this crate promises to build on --
      # its declared `rust-version` -- not a version of the action. Dependabot reads the ref as
      # an action version and "upgrades" it to whatever Rust has most recently released, which
      # pins the MSRV job to a toolchain that is not the MSRV and, when the number does not
      # exist yet, to no toolchain at all. It did exactly that in PR #2 (1.85 -> 1.120). The
      # MSRV moves when Cargo.toml's rust-version moves, by hand, in the same commit.
      - dependency-name: "dtolnay/rust-toolchain"
